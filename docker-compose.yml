services:
  reproduce:
    build:
      context: .
      dockerfile: Dockerfile
    image: intraday-momentum-repro
    volumes:
      - ./outputs:/app/outputs
    command: python -m intraday_momentum.reproduce

  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: intraday-momentum-repro
    command: pytest

  docs:
    build:
      context: .
      dockerfile: Dockerfile
    image: intraday-momentum-repro
    volumes:
      - ./docs/_build:/app/docs/_build
    command: sphinx-build -b html docs docs/_build/html

  shell:
    build:
      context: .
      dockerfile: Dockerfile
    image: intraday-momentum-repro
    volumes:
      - ./outputs:/app/outputs
    entrypoint: /bin/bash
