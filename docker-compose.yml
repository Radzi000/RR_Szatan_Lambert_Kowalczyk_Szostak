services:
  reproduce:
    build:
      context: .
      dockerfile: Dockerfile
    image: intraday-momentum-repro
    volumes:
      - ./outputs:/app/outputs
    command: python -m strategy_development.local_implementation.reproduce

  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: intraday-momentum-repro
    command: pytest

  shell:
    build:
      context: .
      dockerfile: Dockerfile
    image: intraday-momentum-repro
    volumes:
      - ./outputs:/app/outputs
    entrypoint: /bin/bash
