services:
  reproduce:
    build:
      context: .
      dockerfile: Dockerfile
    image: intraday-momentum-repro
    volumes:
      - ./outputs:/app/outputs
    command: python -m strategy_development.local_implementation.reproduce

  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: intraday-momentum-repro
    command: pytest

  shell:
    build:
      context: .
      dockerfile: Dockerfile
    image: intraday-momentum-repro
    volumes:
      - ./outputs:/app/outputs
    entrypoint: /bin/bash

  optimization:
    build:
      context: .
      dockerfile: Dockerfile
    image: intraday-momentum-repro
    volumes:
      - ./outputs:/app/outputs
    command: python -m strategy_development.local_implementation.optimization.run_all_optimizations --smoke

  results:
    build:
      context: .
      dockerfile: Dockerfile
    image: intraday-momentum-repro
    volumes:
      - ./outputs:/app/outputs
    command: python -m strategy_development.local_implementation.optimization.run_all_optimizations --smoke

  report:
    build:
      context: .
      dockerfile: Dockerfile
    image: intraday-momentum-repro
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "python scripts/check_report_inputs.py && quarto render reports/final_report.qmd"

  reproduce-report-full:
    build:
      context: .
      dockerfile: Dockerfile
    image: intraday-momentum-repro
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "python -m preprocessing.materialize_processed_data && python -m strategy_development.local_implementation.run_fixed_15m_experiments && python -m strategy_development.local_implementation.optimization.run_all_optimizations --smoke && python -m final_portfolio.run_report && python scripts/check_report_inputs.py && quarto render reports/final_report.qmd"
